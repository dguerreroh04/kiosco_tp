<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Kiosco</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="inicio.html"><img src="images/logokiosco.png" alt="logo"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
            <a class="nav-link active" style="font-size: large; font-weight: bold;" aria-current="page" href="inicio.html">Inicio</a>
          </div>
        <div class="navbar-nav ms-auto">
          <a class="nav-link active" href="cuenta.html"><img src="images/icon_cuenta.png" alt="Mi Cuenta"></a>
          <a class="nav-link active" href="carrito.html"><img src="images/icon_carrito.png" alt="Carrito de Compras"></a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container_cuenta" style="width: 100%; display: flex; flex-direction: column;">
    <h1 style="display:flex; width: 100%; justify-content: center; margin-top: 10px">Tu Cuenta</h1>

    <div class="contenedor-principal">
        <div class="contenedor">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username1">Correo Electronico:</label>
                    <input type="text" id="username1" name="username1" required>
                </div>
                <div class="input-group">
                    <label for="password1">Contraseña:</label>
                    <input type="password" id="password1" name="password1" required>
                </div>
                <button type="submit">Ingresar</button>
            </form>
        </div>

        <div class="contenedor">
            <h2>Crear Cuenta</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="username2">Usuario:</label>
                    <input type="text" id="username2" name="username2" required>
                </div>
                <div class="input-group">
                    <label for="password2">Contraseña:</label>
                    <input type="password" id="password2" name="password2" required>
                </div>
                <button type="submit">Crear</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
