<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
    <title>Kiosco Informático</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="inicio.html"><img src="../images/logokiosco.png" alt="logo"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
            <a class="nav-link active" style="font-size: large; font-weight: bold;" aria-current="page" href="inicio.html">Kiosco Informático</a>
          </div>
        <div class="navbar-nav ms-auto">
          <div id="saludo_usuario" style="align-content: end;"></div>
          <a class="nav-link active" href="cuenta.html"><img src="../images/icon_cuenta.png" alt="Mi Cuenta"></a>
          <a class="nav-link active" href="carrito.html"><img src="../images/icon_carrito.png" alt="Carrito de Compras"></a>
        </div>
      </div>
    </div>
  </nav>
  <div style="display: flex; justify-content: space-evenly; align-items: flex-start; min-height: 100vh; flex-direction: row; padding: 20px; width: 100%;">
    <div style="width: 50%; display: flex; justify-content: center; flex-direction: column; align-items: center;">
      <div class="container_info_producto" style="width: 50%; display: flex; flex-direction: column;" id="datos_producto">
        <h1 style="display:flex; justify-content: center; margin-top: 20px;font-size: 3.5em;">Producto</h1>
      </div>
    </div>
  

  <div class="container_modificar_producto" style="width: 50%; display: flex; flex-direction: column;">
    <h1 style="display:flex; width: 100%; justify-content: center;font-size: 3.5em;">Modificar Datos</h1>

    <div class="nombre">
      <label class="label">Nombre</label>
      <div class="control">
        <input id="nombre" class="input" type="text" placeholder="Ingrese los datos del producto...">
      </div>
    </div>

    <div class="precio_unidad">
      <label class="label">Precio</label>
      <div class="control">
        <input id="precio_unidad" class="input" type="number" placeholder="Ingrese los datos del producto...">
      </div>
    </div>

    <div class="descripcion">
      <label class="label">Descripcion</label>
      <div class="control">
        <input id="descripcion" class="input" type="text" placeholder="Ingrese los datos del producto...">
      </div>
    </div>

    <div class="nacional">
      <label class="label">Nacional</label>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="flexRadioDefault1" id="flexRadioDefault1">
        <label class="form-check-label" for="flexRadioDefault1">
          True
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="flexRadioDefault1" id="flexRadioDefault1">
        <label class="form-check-label" for="flexRadioDefault1">
          False
        </label>
      </div>
    </div>

    <div class="categoria">
      <label class="label">Categoria</label>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="flexRadioDefault2" id="flexRadioDefault2">
        <label class="form-check-label" for="flexRadioDefault2">
          Dulce
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="flexRadioDefault2" id="flexRadioDefault2">
        <label class="form-check-label" for="flexRadioDefault2">
          Salado
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="flexRadioDefault2" id="flexRadioDefault2">
        <label class="form-check-label" for="flexRadioDefault2">
          Bebidas
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="flexRadioDefault2" id="flexRadioDefault2">
        <label class="form-check-label" for="flexRadioDefault2">
          Legumbre
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="flexRadioDefault2" id="flexRadioDefault2">
        <label class="form-check-label" for="flexRadioDefault2">
          Arroz
        </label>
      </div>
    </div>
    <div class="imagen">
      <label class="label">URL Imagen</label>
      <div class="control">
        <input id="imagen" class="input" type="text" placeholder="Ingrese los datos del producto...">
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1000px; margin: 0 auto; padding: 10px;">
      <div class="control">
          <button class="button1" onclick="guardar()">Guardar Cambios</button>
      </div>

      <div class="control">
          <button class="button2" id="borrarBtn" onclick="borrar()">Borrar Producto</button>
      </div>
    </div>
  <script src="../scripts/modificar_producto.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
