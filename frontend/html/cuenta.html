<html lang="en">

</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="inicio.html"><img src="../images/logokiosco.png" alt="logo"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
            <a class="nav-link active" style="font-size: large; font-weight: bold;" aria-current="page" href="inicio.html">Inicio</a>
          </div>
        <div class="navbar-nav ms-auto">
          <a class="nav-link active" href="cuenta.html"><img src="../images/icon_cuenta.png" alt="Mi Cuenta"></a>
          <a class="nav-link active" href="carrito.html"><img src="../images/icon_carrito.png" alt="Carrito de Compras"></a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container_cuenta" style="width: 100%; display: flex; flex-direction: column;">
    <h1 style="display:flex; width: 100%; justify-content: center;">Tu Cuenta</h1>

    <div class="nombre">
      <label class="label">Nombre</label>
      <div class="control">
        <input class="input" type="text" placeholder="Ingrese sus datos aqui...">
      </div>
    </div>

    <div class="edad">
      <label class="label">Edad</label>
      <div class="control">
        <input class="input" type="text" placeholder="Ingrese sus datos aqui...">
      </div>
    </div>

    <div class="mail">
      <label class="label">Mail</label>
      <div class="control">
        <input class="input" type="text" placeholder="Ingrese sus datos aqui...">
      </div>
    </div>

    <div class="numtel">
      <label class="label">Nro. de Telefono</label>
      <div class="control">
        <input class="input" type="text" placeholder="Ingrese sus datos aqui...">
      </div>
    </div>

    <div class="dni">
      <label class="label">DNI</label>
      <div class="control">
        <input class="input" type="text" placeholder="Ingrese sus datos aqui...">
      </div>
    </div>

    <div class="control">
      <button id="guardarBtn" class="button is-primary">Guardar Cambios</button>

      </div>
    </div>

  <script src="../scripts/cuenta.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
